<!--
  Supabase → Authentication → Emails → "Confirm signup" template.
  Inline styles only, for email-client safety.
-->
<div style="background:#f4f6f8;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:16px;border:1px solid #e6e9ee;overflow:hidden;">
    <div style="padding:26px 28px 6px;">
      <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4A90E2;">Runsheet</div>
      <h1 style="margin:12px 0 6px;font-size:20px;color:#1c2530;">Confirm your email</h1>
      <p style="margin:0;color:#6b7684;font-size:14px;line-height:1.55;">You're almost in — confirm your email to start planning your trips.</p>
    </div>
    <div style="padding:14px 28px 26px;">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#4A90E2;color:#ffffff;text-decoration:none;font-weight:700;font-size:14px;padding:12px 20px;border-radius:12px;">Confirm email</a>
      <p style="margin:18px 0 0;color:#9aa4b0;font-size:12px;line-height:1.5;">If you didn't create a Runsheet account, you can ignore this email.</p>
    </div>
  </div>
</div>
