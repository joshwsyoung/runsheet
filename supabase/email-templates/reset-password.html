<!--
  Supabase → Authentication → Emails → "Reset Password" template.
  Uses {{ .Token }} (the 6-digit code, for the in-app /reset-password flow) and keeps
  {{ .ConfirmationURL }} as a fallback link. Inline styles only, for email-client safety.
-->
<div style="background:#f4f6f8;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:16px;border:1px solid #e6e9ee;overflow:hidden;">
    <div style="padding:26px 28px 6px;">
      <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4A90E2;">Runsheet</div>
      <h1 style="margin:12px 0 6px;font-size:20px;color:#1c2530;">Reset your password</h1>
      <p style="margin:0;color:#6b7684;font-size:14px;line-height:1.55;">Enter this code in the app to choose a new password. It expires shortly.</p>
    </div>
    <div style="padding:6px 28px 26px;">
      <div style="margin:18px 0;padding:18px;text-align:center;background:#eef5ff;border-radius:12px;font-size:30px;font-weight:800;letter-spacing:8px;color:#1c2530;">{{ .Token }}</div>
      <p style="margin:0 0 12px;color:#6b7684;font-size:13px;line-height:1.5;">Or use this link on the same device:</p>
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#4A90E2;color:#ffffff;text-decoration:none;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;">Reset password</a>
      <p style="margin:18px 0 0;color:#9aa4b0;font-size:12px;line-height:1.5;">Didn't request this? You can safely ignore this email — your password won't change.</p>
    </div>
  </div>
</div>
